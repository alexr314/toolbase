<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="toolbase trace export">
<title>__TITLE__ · provenance trace</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<header id="hdr">
  <div class="hdr-main">
    <div class="hdr-title">
      <div class="eyebrow">Provenance trace</div>
      <h1 id="run-title">__TITLE__</h1>
    </div>
    <dl class="hdr-facts" id="facts"></dl>
    <div class="hdr-tools">
      <button class="btn ghost" id="notes-btn" hidden></button>
      <button class="btn ghost icon" id="theme-btn" title="Light or dark theme" aria-label="Toggle theme">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm0 1.5v10a5 5 0 0 1 0-10Z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
  <nav id="tabs" role="tablist">
    <button data-tab="agents" class="on">Agents</button>
    <button data-tab="prov">Provenance</button>
    <button data-tab="timeline">Timeline</button>
    <button data-tab="files">Files</button>
  </nav>
</header>
<div id="notes" class="popover" hidden><h3>Export notes</h3><ul id="notes-list"></ul></div>

<main id="views">
  <section class="view on" id="v-agents">
    <div class="graph-pane" id="graph-pane">
      <div class="pane-bar">
        <span class="pane-title">Agents</span>
        <label class="tog"><input type="checkbox" id="e-tree" checked><span class="sw-line tree"></span>hierarchy</label>
        <label class="tog"><input type="checkbox" id="e-msg" checked><span class="sw-line msg"></span>messages</label>
        <span class="grow"></span>
        <div class="seg"><button id="z-out" title="Zoom out">−</button><span id="z-pct">100%</span><button id="z-in" title="Zoom in">+</button><button id="z-fit">Fit</button></div>
      </div>
      <div class="graph-canvas" id="graph-canvas"><div class="graph-world" id="graph-world"><svg id="graph-edges"></svg><div id="graph-cards"></div></div></div>
    </div>
    <div class="seq-pane" id="seq-pane">
      <div class="seq-head" id="seq-head"></div>
      <div class="seq-bar" id="seq-bar">
        <input type="search" id="s-q" placeholder="Search this agent's work">
        <div class="seg kinds" id="s-kinds"><button data-k="call" class="on">Tool calls</button><button data-k="command" class="on">Shell</button><button data-k="message" class="on">Messages</button></div>
        <select id="s-tool"><option value="">All tools</option></select>
        <label class="tog"><input type="checkbox" id="s-failed">failed only</label>
        <span class="grow"></span>
        <button class="btn ghost small" id="s-expand">Expand all</button>
      </div>
      <div class="seq-scroll" id="seq-scroll"><div class="seq" id="seq"></div></div>
    </div>
  </section>

  <section class="view" id="v-prov">
    <div class="prov-pane">
      <div class="pane-bar">
        <span class="pane-title">Provenance</span>
        <span class="lbl">inputs</span><select id="p-up"><option>1</option><option>2</option><option selected>3</option><option>6</option><option value="99">all</option></select>
        <span class="lbl">used by</span><select id="p-down"><option>0</option><option selected>1</option><option>2</option><option value="99">all</option></select>
        <span class="grow"></span>
        <span class="muted small" id="p-info"></span>
        <div class="seg"><button id="p-fit">Fit</button></div>
      </div>
      <div class="graph-canvas" id="p-canvas"><div class="graph-world" id="p-world"><svg id="p-edges"></svg><div id="p-cards"></div></div></div>
    </div>
    <aside class="side" id="p-side"></aside>
  </section>

  <section class="view" id="v-timeline">
    <div class="tl-pane">
      <div class="pane-bar">
        <span class="pane-title">Timeline</span>
        <div class="seg kinds" id="t-kinds"><button data-k="call" class="on">Tool calls</button><button data-k="command" class="on">Shell</button><button data-k="message" class="on">Messages</button></div>
        <label class="tog"><input type="checkbox" id="t-failed">failed only</label>
        <span class="grow"></span>
        <span class="muted small">scroll to zoom · drag to pan · click to open</span>
        <div class="seg"><button id="t-out">−</button><button id="t-in">+</button><button id="t-fit">Fit</button></div>
      </div>
      <div class="tl-scroll" id="tl-scroll"><svg id="tl"></svg></div>
    </div>
  </section>

  <section class="view" id="v-files">
    <div class="files-pane">
      <div class="pane-bar">
        <span class="pane-title">Files</span>
        <input type="search" id="f-q" placeholder="Path, hash prefix or call id">
        <select id="f-origin">
          <option value="">Any origin</option>
          <option value="recorded">Generated by a call or named write</option>
          <option value="inferred">Generated (inferred)</option>
          <option value="unknown">Unknown origin</option>
          <option value="absent">Not in the sandbox now</option>
        </select>
        <label class="tog"><input type="checkbox" id="f-graph">named by a call or command</label>
        <span class="grow"></span>
        <span class="muted small" id="f-info"></span>
      </div>
      <div class="tbl-scroll" id="f-scroll"></div>
    </div>
    <aside class="side" id="f-side"></aside>
  </section>
</main>
<div id="tip" role="tooltip"></div>
<script type="application/json" id="trace-data">__DATA__</script>
<script>
/*__JS__*/
</script>
</body>
</html>
