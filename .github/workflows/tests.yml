name: tests

# The unit suite on every push and PR; the e2e harnesses on PRs to main
# and on demand. They are split because the harnesses build real venvs
# and reach PyPI, so they are slower and can fail for reasons that have
# nothing to do with the change under review.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run of the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (py${{ matrix.python }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor (requires-python). 3.13 catches deprecations
        # before they become failures — the suite already surfaces one
        # from tarfile.extractall.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Unit tests
        # e2e is excluded here: those spawn subprocesses and build venvs.
        run: pytest tests/ --ignore=tests/e2e -q

      - name: No state written outside the sandbox
        # Every test must redirect CONFIG_DIR and pin cwd. A test that
        # forgets writes into the checkout instead, which has happened
        # repeatedly and is invisible locally because the files look like
        # ordinary project state.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::tests modified the working tree:"
            git status --porcelain
            exit 1
          fi

  e2e:
    name: e2e harnesses
    timeout-minutes: 30
    # Slower and network-dependent (they pip-install into real venvs), so
    # they gate merges to main rather than every push to a branch.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run the harnesses
        # Each is a standalone script exiting non-zero on failure. They
        # are independent, so run all of them and report the whole
        # picture rather than stopping at the first -- one broken
        # harness shouldn't hide the state of the other twelve.
        run: |
          failed=""
          for f in tests/e2e/run_*.py; do
            name=$(basename "$f")
            echo "::group::$name"
            if python "$f"; then
              echo "PASS $name"
            else
              echo "FAIL $name"
              failed="$failed $name"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failing harnesses:$failed"
            exit 1
          fi

      - name: No state written outside the sandbox
        # The harnesses build real installs and must keep them in $TMPDIR.
        # One of them used to run from the repo root, and since .toolbase/
        # is the project marker, its leftovers there changed what a later
        # run resolved -- a test suite grading its own residue.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::harnesses modified the working tree:"
            git status --porcelain
            exit 1
          fi
