name: tests

# The unit suite on every push and PR; the e2e harnesses on PRs to main
# and on demand. They are split because the harnesses build real venvs
# and reach PyPI, so they are slower and can fail for reasons that have
# nothing to do with the change under review.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run of the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor (requires-python). 3.13 catches deprecations
        # before they become failures — the suite already surfaces one
        # from tarfile.extractall.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Unit tests
        # e2e is excluded here: those spawn subprocesses and build venvs.
        run: pytest tests/ --ignore=tests/e2e -q

      - name: No state written outside the sandbox
        # Every test must redirect CONFIG_DIR and pin cwd. A test that
        # forgets writes into the checkout instead, which has happened
        # repeatedly and is invisible locally because the files look like
        # ordinary project state.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::tests modified the working tree:"
            git status --porcelain
            exit 1
          fi

  e2e:
    name: e2e harnesses
    # Slower and network-dependent (they pip-install into real venvs), so
    # they gate merges to main rather than every push to a branch.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run the harnesses
        # Each is a standalone script exiting non-zero on failure. They
        # are independent, so run all of them and report the whole
        # picture rather than stopping at the first.
        #
        # KNOWN_FAILING is checked in deliberately. Seven harnesses have
        # been broken for months against shipped changes nobody updated
        # them for — a CI that is red on day one gets ignored, and a CI
        # that silently skips them never gets fixed. Listing them keeps
        # the rest meaningful, and the list is the backlog.
        #
        # The check is strict both ways: a listed harness that starts
        # passing also fails the job, so the list can't rot.
        run: |
          KNOWN_FAILING="
            run_aster_synthetic_e2e.py
            run_bundles_e2e.py
            run_envs_e2e.py
            run_restart_e2e.py
            run_setup_e2e.py
            run_setup_script_e2e.py
            run_two_layer_config_e2e.py
          "
          regressed=""
          fixed=""
          for f in tests/e2e/run_*.py; do
            name=$(basename "$f")
            known=$(echo "$KNOWN_FAILING" | tr -d ' ' | grep -qx "$name" && echo yes || echo no)
            echo "::group::$name (known-failing: $known)"
            if python "$f"; then
              echo "PASS $name"
              [ "$known" = yes ] && fixed="$fixed $name"
            else
              echo "FAIL $name"
              [ "$known" = no ] && regressed="$regressed $name"
            fi
            echo "::endgroup::"
          done
          status=0
          if [ -n "$regressed" ]; then
            echo "::error::harnesses that were passing now fail:$regressed"
            status=1
          fi
          if [ -n "$fixed" ]; then
            echo "::error::these now pass — remove them from KNOWN_FAILING:$fixed"
            status=1
          fi
          exit $status
